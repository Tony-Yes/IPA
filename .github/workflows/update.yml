name: Update MoviePilot source
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - update.py
      - apps.json
      - test_update.py
      - .github/workflows/update.yml
permissions:
  contents: write
concurrency:
  group: update-source
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run updater tests
        run: python -m unittest -v
      - name: Fetch release and verify IPA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update.py
      - name: Commit source changes
        run: |
          if [ -n "$(git status --porcelain -- source.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source.json
            git commit -m 'Update MoviePilot release feed'
            git push origin HEAD:main
          fi
